<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h2>Mixin y include </h2>
    <table class="tabla">
        <thead class="tabla-head">
            <tr>
                <th>Objeto 1</th>
                <th>Objeto 2</th>
                <th>Objeto 3</th>
            </tr>
        </thead>
        <tbody class="tabla-body">
            <tr>
                <td>10</td>
                <td>15</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>
    <h2>Place holder y extend</h2>
    <section class="section-pri">
        <article class="article-pri">
            <h2>Subtitulo</h2>
            <p>Descripcion</p>
        </article>
        <article class="article-seg">
            <h2>Subtitulo</h2>
            <p>Descripcion</p>
        </article>
    </section>
    <h2>Botones con for y condicional</h2>
    <section>
        <button class="btn-1">1</button>
        <button class="btn-2">2</button>
        <button class="btn-3">3</button>
        <button class="btn-4">4</button>
    </section>
    <h2>Colores de botones con each</h2>
    <section>
        <button class="btn-primary">1</button>
        <button class="btn-secondary">2</button>
        <button class="btn-success">3</button>
        <button class="btn-warning">4</button>
    </section>
</body>
</html>
